name: collect

# Every 30 minutes: pull the public FiveM server list, write data/summary.json + data/history.json.
# Public repo = free GitHub Actions minutes. serversidedev.com/tracker reads the files from raw.githubusercontent.com.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect
        run: node collector/collect.mjs --top 300 --out data
      - name: Commit data
        run: |
          git config user.name "serverside-tracker"
          git config user.email "tracker@serversidedev.com"
          git add data/summary.json data/history.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)" --quiet
          for i in 1 2 3; do git pull --rebase --quiet && git push --quiet && exit 0; sleep 5; done
          exit 1
